<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f5"><title>吃點可愛的｜口袋找吃小幫手</title><link rel="icon" type="image/svg+xml" href="icon.svg?v=5"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=11"></head><body>
<div class="app"><header><a class="brand" href="./" aria-label="首頁"><img class="logo" src="elephant.svg?v=5" alt="拿筷子的小象標誌"> 吃點可愛的<span class="tiny">POCKET BITES</span></a><div class="header-tools"><button class="round motion-control" id="motionToggle" aria-label="關閉小動畫" aria-pressed="true">✦</button><button class="round" id="saved" aria-label="看附近收藏">♡</button></div></header>
<main><div class="eyebrow"><span class="mini-heart">♥</span> YOUR LITTLE FOOD DATE</div><section class="hero"><div><h1>今天想吃點<br><span>可愛的快樂 ♡</span></h1><p>選個心情，小象帶你去找附近好吃的。</p></div><button class="mascot" id="petBun" aria-label="戳戳小象"><div class="spark">✦</div><img class="ellie" src="elephant.svg?v=5" alt=""><div class="plate"></div><span class="sticker">戳我一下 ♡</span></button></section>
<div class="step-label"><b>01</b> 從你附近出發</div><button id="locate" class="location"><span>⌖</span><div><strong id="locationTitle">用我的位置找吃的</strong><small id="locationText">點一下，允許定位就好</small></div><span class="arrow">↗</span></button><form id="placeForm" class="place-form"><span>或</span><input id="placeInput" aria-label="輸入地點" placeholder="輸入地點，例如：高雄車站" autocomplete="off"><button id="placeGo">用這裡</button></form>
<section class="finder-panel" aria-label="找吃條件"><div class="step-label"><b>02</b> 今天想吃什麼？</div><form id="searchForm" class="search"><span>⌕</span><input id="query" aria-label="想吃的關鍵字" placeholder="想吃什麼？例如：拉麵、豆花" autocomplete="off"><button aria-label="搜尋">搜尋</button></form>
<div class="categories" role="group" aria-label="食物心情"><button data-cat="餐廳" class="active" aria-pressed="true"><span>🍽️</span>都想看看</button><button data-cat="沙拉 輕食" aria-pressed="false"><span>🥗</span>清爽一點</button><button data-cat="炸雞" aria-pressed="false"><span>🍗</span>炸的快樂</button><button data-cat="甜點" aria-pressed="false"><span>🍮</span>甜甜療癒</button><button data-cat="漢堡" aria-pressed="false"><span>🍔</span>漢堡時間</button></div>
<div class="mode-row" role="group" aria-label="交通方式"><span class="mode-title">怎麼過去？</span><button data-mode="walk" class="active" aria-pressed="true"><span>🚶</span>步行</button><button data-mode="scooter" aria-pressed="false"><span>🛵</span>騎機車</button><button data-mode="car" aria-pressed="false"><span>🚗</span>開車</button></div>
<div class="filters one"><label><span id="timeLabel">🚶 步行時間</span><select id="minutes"><option value="10" selected>10 分鐘內</option><option value="15">15 分鐘內</option><option value="20">20 分鐘內</option><option value="30">30 分鐘內</option></select></label></div>
<button id="goMaps" class="show-results">找附近的 <span id="goWhat">餐廳</span> <b id="goArrow">↓</b></button><p class="go-note" id="goNote">直接列出附近真實店家的照片、星數與營業狀態。</p></section>
<section class="nearby" id="results" aria-live="polite" hidden></section>
<section class="saved-near" id="savedNear" aria-live="polite"></section>
<footer>吃點可愛的 · 把找吃的，變成一件小確幸。<br><span>定位只在這個頁面計算距離，按下 Google Maps 按鈕時才會帶給 Google。<br>收藏店家取自你的 Google Maps「想去的地點」清單。</span></footer></main>
<nav class="bottom"><button id="explore" class="selected">⌕<span>找好吃的</span></button><button id="bottomSaved">♡<span>附近收藏</span></button><button id="about">✧<span>怎麼使用</span></button></nav></div>
<dialog id="sheet"><div class="handle"></div><button id="closeSheet" class="close" aria-label="關閉">×</button><div id="sheetContent"></div></dialog><div id="toast" role="status"></div><script src="config.js?v=9"></script><script src="gate.js?v=9"></script><script src="app.js?v=12"></script></body></html>
